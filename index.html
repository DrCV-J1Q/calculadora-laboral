<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr CV - Cálculo de Horas Extras, Rol y Beneficios</title>
    <style>
        :root {
            --primary: #1e40af;
            --primary-hover: #1e3a8a;
            --success: #10b981;
            --success-hover: #059669;
            --warning: #f59e0b;
            --warning-hover: #d97706;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --naranja-excel: #ed7d31;
            --finde-excel: #f4b084;
            --feriado-excel: #ffff00;
            --bg-gradient: linear-gradient(135deg, #0b1120 0%, #1e293b 100%);
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.18), 0 10px 10px -5px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
            color: #334155;
            min-height: 100vh;
        }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseValor {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .animar-entrada { animation: fadeSlideIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .animar-pulso { animation: pulseValor 0.25s ease; }

        .wrapper-principal {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 24px);
            width: 100%;
        }

        .contenedor {
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 440px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.85);
            box-sizing: border-box;
        }

        .contenedor-ancho { max-width: 1020px; }

        h2 {
            color: #0f172a;
            text-align: center;
            margin-bottom: 18px;
            margin-top: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        h3 {
            color: #0f172a;
            margin: 22px 0 12px;
            font-size: 16px;
            font-weight: 800;
            border-left: 4px solid var(--naranja-excel);
            padding-left: 10px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: 600;
            color: #475569;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, button {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, transform 0.18s ease;
            background-color: #f8fafc;
        }
