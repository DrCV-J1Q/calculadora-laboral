<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr CV - Cálculo de Horas Extras y Rol</title>
    <style>
        :root {
            --primary: #1e40af;
            --primary-hover: #1e3a8a;
            --success: #10b981;
            --success-hover: #059669;
            --warning: #f59e0b;
            --warning-hover: #d97706;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --naranja-excel: #ed7d31;
            --finde-excel: #f4b084;
            --feriado-excel: #ffff00;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            color: #334155;
            min-height: 100vh;
        }

        /* ANIMACIONES LIGERAS Y ELEGANTES */
        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseValor {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .animar-entrada {
            animation: fadeSlideIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .animar-pulso {
            animation: pulseValor 0.25s ease;
        }

        .wrapper-principal {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 20px);
            width: 100%;
        }

        .contenedor {
            background: #ffffff;
            padding: 22px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 440px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-sizing: border-box;
        }

        .contenedor-ancho {
            max-width: 980px;
        }

        h2 { 
            color: #0f172a; 
            text-align: center; 
            margin-bottom: 16px; 
            margin-top: 0; 
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        label { 
            display: block; 
            margin-top: 12px; 
            font-weight: 600; 
            color: #475569; 
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, button {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, transform 0.18s ease;
            background-color: #f8fafc;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.15);
            background-color: #ffffff;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            margin-top: 12px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.4px;
            box-shadow: 0 4px 6px -1px rgba(30, 64, 175, 0.2);
        }

        button:hover { 
            background-color: var(--primary-hover); 
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0) scale(0.99);
        }

        .oculto { display: none !important; }

        /* BARRA SUPERIOR USUARIO + FECHA Y HORA ACTUAL */
        .barra-estado-superior {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            color: #f8fafc;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 10px 14px;
            border-radius: 12px;
            width: 100%;
            max-width: 560px;
            box-sizing: border-box;
            backdrop-filter: blur(6px);
        }

        .reloj-actual {
            font-variant-numeric: tabular-nums;
            background: rgba(15, 23, 42, 0.55);
            padding: 5px 10px;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .menu-navegacion {
            display: flex;
            justify-content: space-around;
            background: #1e293b;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 18px;
            width: 100%;
            max-width: 560px;
            box-sizing: border-box;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .pestana {
            color: #94a3b8;
            padding: 10px 12px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.22s ease;
            text-align: center;
            flex: 1;
            font-size: 13px;
        }

        .pestana:hover {
            color: #f8fafc;
            background-color: rgba(255, 255, 255, 0.06);
        }

        .pestana.activa {
            background-color: #ffffff;
            color: #0f172a;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
            transform: translateY(-1px);
        }

        .error { 
            color: var(--danger); 
            font-size: 13px; 
            text-align: center; 
            margin-top: 12px; 
            font-weight: 600;
        }

        /* BARRA SUPERIOR PLANILLA EXCEL */
        .barra-controles-planilla {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 14px;
        }

        .grupo-control {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .grupo-control label {
            margin: 0;
            font-size: 12px;
            color: #0f172a;
        }

        .grupo-control select, .grupo-control input {
            width: auto;
            margin: 0;
            padding: 7px 10px;
            font-size: 13px;
            font-weight: 600;
            background: #ffffff;
        }

        .badge-mes-excel {
            background-color: var(--naranja-excel);
            color: #000000;
            font-weight: 800;
            padding: 6px 14px;
            border: 1px solid #1e293b;
            font-size: 13px;
            text-transform: uppercase;
        }

        .badge-mes-nombre {
            background-color: var(--naranja-excel);
            color: #000000;
            font-weight: 800;
            padding: 6px 18px;
            border: 1px solid #1e293b;
            border-left: none;
            font-size: 13px;
            text-transform: uppercase;
        }

        /* TABLA ESTILO EXCEL */
        .tabla-contenedor {
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid #64748b;
            width: 100%;
        }

        .tabla-excel {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background: #ffffff;
            min-width: 780px;
        }

        .tabla-excel th {
            background-color: var(--naranja-excel);
            color: #000000;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 12px;
            border: 1px solid #334155;
            padding: 8px 6px;
            text-align: center;
        }

        .tabla-excel td {
            border: 1px solid #64748b;
            padding: 4px 6px;
            text-align: center;
            color: #000000;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        .tabla-excel tbody tr:hover td:not(.celda-fecha):not(.celda-dia) {
            background-color: #f8fafc;
        }

        .fila-finde td.celda-dia,
        .fila-finde td.celda-fecha {
            background-color: var(--finde-excel);
            font-weight: 700;
        }

        .fila-feriado td.celda-dia,
        .fila-feriado td.celda-fecha {
            background-color: var(--feriado-excel);
            font-weight: 700;
        }

        .input-hora-excel {
            width: 108px;
            padding: 4px 5px;
            margin: 0;
            font-size: 12px;
            text-align: center;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.94);
        }

        .select-tipo-excel {
            width: 135px;
            padding: 4px 5px;
            margin: 0;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.94);
        }

        .btn-limpiar-fila {
            width: auto;
            margin: 0;
            padding: 3px 7px;
            font-size: 11px;
            background-color: #e2e8f0;
            color: #334155;
            box-shadow: none;
        }

        .btn-limpiar-fila:hover {
            background-color: #cbd5e1;
        }

        .celda-subtotal-label {
            background-color: var(--naranja-excel) !important;
            color: #000000 !important;
            font-weight: 800 !important;
            text-align: center !important;
        }

        .celda-subtotal-val {
            background-color: #ffffff !important;
            color: #000000 !important;
            font-weight: 800 !important;
        }

        .celda-total-val {
            background-color: #ffffff !important;
            color: #0f172a !important;
            font-weight: 900 !important;
            font-size: 14px;
        }

        .resumen-dinero-barra {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
            margin-top: 14px;
            padding: 12px 16px;
            background: #f1f5f9;
            border-left: 5px solid var(--primary);
            border-radius: 8px;
            font-size: 14px;
        }

        /* ESTILOS ROL DE PAGOS */
        .rol-header-periodo {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
        }
        .rol-badge-naranja {
            background-color: #ea580c;
            color: white;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
        }
        .rol-input-fecha {
            width: auto;
            margin: 0;
            padding: 6px 10px;
            font-weight: 600;
            background: white;
        }
        .tabla-rol {
            width: 100%;
            border-collapse: collapse;
            min-width: 720px;
            border: 1px solid #94a3b8;
        }
        .tabla-rol th {
            background-color: #808080;
            color: #ffffff;
            border: 1px solid #64748b;
            font-size: 12px;
            padding: 10px 8px;
        }
        .tabla-rol td {
            border: 1px solid #cbd5e1;
            padding: 6px 8px;
            background-color: #ffffff;
            font-size: 13px;
        }
        .celda-concepto { text-align: left; font-weight: 600; color: #1e293b; }
